spring.application.name=bancoudea
# Render define PORT; en local usa 8080
server.port=${PORT:8080}

# Variables de entorno en la nube; valores por defecto para uso local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco2025?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:CAMBIAR_POR_TU_CLAVE}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Tu clave real local va en application-local.properties (ignorado por git)
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
